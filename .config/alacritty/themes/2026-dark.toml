# 2026-dark-alacritty.toml — Alacritty colorscheme
# Monokai, with the editor background overridden to black (#121314).
# Palette: Monokai (Wimer Hazenberg); group mapping follows sickill/vim-monokai (MIT)
# License: MIT
#
# Usage: paste into your alacritty.toml, or save separately and import:
#   [general]
#   import = ["~/.config/alacritty/themes/2026-dark.toml"]

[colors.primary]
background    = "#121314"     # black override (Monokai background is #272822)
foreground    = "#f8f8f2"
dim_foreground = "#75715e"

[colors.cursor]
text   = "#272822"
cursor = "#f8f8f0"

[colors.vi_mode_cursor]
text   = "#272822"
cursor = "#66d9ef"

[colors.selection]
text       = "CellForeground"
background = "#49483e"

[colors.search.matches]
foreground = "#121314"
background = "#e6db74"

[colors.search.focused_match]
foreground = "#121314"
background = "#fd971f"

[colors.hints.start]
foreground = "#121314"
background = "#fd971f"

[colors.hints.end]
foreground = "#121314"
background = "#75715e"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#f8f8f2"
background = "#64645e"

# ──────────────────────────────────────────────
# Normal (standard) terminal colors — Monokai
# ──────────────────────────────────────────────
[colors.normal]
black   = "#272822"
red     = "#f92672"
green   = "#a6e22e"
yellow  = "#e6db74"
blue    = "#66d9ef"
magenta = "#ae81ff"
cyan    = "#a1efe4"
white   = "#f8f8f2"

# ──────────────────────────────────────────────
# Bright terminal colors
# ──────────────────────────────────────────────
[colors.bright]
black   = "#75715e"
red     = "#f92672"
green   = "#a6e22e"
yellow  = "#e6db74"
blue    = "#66d9ef"
magenta = "#ae81ff"
cyan    = "#a1efe4"
white   = "#f9f8f5"

# ──────────────────────────────────────────────
# Dim colors (unfocused terminal) — accents darkened ~30%
# ──────────────────────────────────────────────
[colors.dim]
black   = "#121314"
red     = "#ae1a4f"
green   = "#749e20"
yellow  = "#a19951"
blue    = "#4797a7"
magenta = "#795ab2"
cyan    = "#70a79f"
white   = "#75715e"
