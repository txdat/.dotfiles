# 2026-dark — foot terminal colorscheme
# Monokai, with the editor background overridden to black (#121314).
# Palette: Monokai (Wimer Hazenberg); group mapping follows sickill/vim-monokai (MIT)
# License: MIT
#
# Install (foot >= 1.23):
#   mkdir -p ~/.config/foot/themes
#   cp 2026-dark.ini ~/.config/foot/themes/
#
# Then in ~/.config/foot/foot.ini:
#   include=~/.config/foot/themes/2026-dark.ini
#
# Or inline: copy the [colors-dark] block directly into foot.ini
#
# Color mapping (Monokai):
#   background    black override            #121314
#   foreground    text                      #f8f8f2
#   regular0      surface                   #272822
#   regular1      pink (keyword)            #f92672
#   regular2      green (function/tag)      #a6e22e
#   regular3      yellow (string)           #e6db74
#   regular4      blue (type/identifier)    #66d9ef
#   regular5      purple (constant)         #ae81ff
#   regular6      cyan                      #a1efe4
#   regular7      text                      #f8f8f2
#   bright0       comment                   #75715e
#   bright1..6    same hues, brighter white
#   bright7       near-white                #f9f8f5
#   dim0-7        dimmed variants for inactive windows

[colors-dark]
background=121314
foreground=f8f8f2
# Cursor: foreground on cursor block / cursor block color
# Default (reversed cell) is fine; uncomment to override:
# cursor=f8f8f0 f8f8f0

# Selection: text / background
selection-foreground=f8f8f2
selection-background=49483e
# Normal 16 colors
regular0=272822
regular1=f92672
regular2=a6e22e
regular3=e6db74
regular4=66d9ef
regular5=ae81ff
regular6=a1efe4
regular7=f8f8f2
bright0=75715e
bright1=f92672
bright2=a6e22e
bright3=e6db74
bright4=66d9ef
bright5=ae81ff
bright6=a1efe4
bright7=f9f8f5
# Dim colors — shown in inactive/unfocused panes (tmux, etc.)
# Derived by darkening normal colors ~30%
dim0=121314
dim1=ae1a4f
dim2=749e20
dim3=a19951
dim4=4797a7
dim5=795ab2
dim6=70a79f
dim7=75715e
