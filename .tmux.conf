# ─── terminal ─────────────────────────────────────────────────────────────────

set -g  default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'  # truecolor
set -as terminal-features ',*:usstyle'           # undercurl + underline colours

set -g extended-keys on
set -g extended-keys-format csi-u
set -s escape-time 0
set -s focus-events on
set -g mouse on

# ─── general ──────────────────────────────────────────────────────────────────

unbind C-b
set -g prefix C-x
bind C-x send-prefix

set -g history-limit 10000
set -g repeat-time 500         # window for repeatable (-r) keys
set -g status-keys vi
set -g mode-keys vi

set -g  base-index 1           # number windows and panes from 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  set-titles on

set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10

set -g bell-action none        # visual-* and monitor-activity are off by default

# ─── keys ─────────────────────────────────────────────────────────────────────

bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'
bind R refresh-client
bind -n C-l send-keys C-l \; clear-history  # clear screen and scrollback

# session
bind C-n  new-session
bind C-q  kill-session
bind C-f  command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l  # last session

# window
bind C-t new-window
bind C-w kill-window
bind C-d kill-pane
unbind n
unbind p
bind -r C-[ previous-window
bind -r C-] next-window

# split
unbind '"'
unbind %
bind -  split-window -v
bind \\ split-window -h

# pane: select / swap / resize
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -r [ swap-pane -U
bind -r ] swap-pane -D
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# ─── status line ──────────────────────────────────────────────────────────────

set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left " [#S] "
set -g status-right ""

setw -g window-status-separator ""
setw -g window-status-style NONE
setw -g window-status-current-style NONE  # tmux 3.8 default is underscore
setw -g window-status-activity-style NONE
setw -g window-status-format " #I:#W #F "
setw -g window-status-current-format "#[reverse] #I:#W #F "
